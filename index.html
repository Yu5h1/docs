<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Yu5h1 的文件、教學流程與公開進度報告入口。" />
    <title>Yu5h1 Docs</title>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        if (params.has("scope") || params.has("report") || params.has("dev")) {
          window.location.replace(`task-progress/${window.location.search}${window.location.hash}`);
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        width: min(42rem, calc(100% - 2rem));
      }

      h1 {
        margin-bottom: 0.5rem;
      }

      p {
        color: color-mix(in srgb, CanvasText 70%, transparent);
      }

      nav {
        display: grid;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a {
        display: block;
        padding: 1rem 1.25rem;
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-radius: 0.75rem;
        color: inherit;
        text-decoration: none;
      }

      a:hover {
        border-color: LinkText;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Yu5h1 Docs</h1>
      <p>文件、教學流程與公開專案進度的入口。</p>
      <nav aria-label="主要內容">
        <a href="task-progress/">
          <strong>TaskProgress Viewer</strong><br />
          查看公開的專案進度報告
        </a>
      </nav>
    </main>
  </body>
</html>
